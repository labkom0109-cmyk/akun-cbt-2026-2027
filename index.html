<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cek Akun Ujian CBT AKM 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --accent: #06b6d4;
      --bg-dark: #0f172a;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border: rgba(226, 232, 240, 0.9);
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #0b1120;
      background-image:
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.45) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.35) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.35) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(14, 165, 233, 0.3) 0px, transparent 50%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle animated ambient grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      width: 100%;
      max-width: 490px;
      position: relative;
      z-index: 1;
    }

    .glass-card {
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 36px 30px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      transition: transform 0.3s ease;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .icon-shield {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.5);
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 10px;
      border: 1px solid rgba(79, 70, 229, 0.2);
    }

    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .brand-header h1 {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .brand-header p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .search-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .field-hint {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: #64748b;
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 15px 42px 15px 44px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-main);
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.8px;
    }

    .input-wrapper input::placeholder {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 400;
      letter-spacing: 0;
      color: #94a3b8;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.16);
    }

    .btn-clear {
      position: absolute;
      right: 12px;
      background: #f1f5f9;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #64748b;
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-clear:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-submit {
      width: 100%;
      padding: 15px 20px;
      background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 20px -6px rgba(79, 70, 229, 0.55);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px -6px rgba(79, 70, 229, 0.65);
      filter: brightness(1.05);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Result Area */
    .result-area {
      margin-top: 24px;
      display: none;
    }

    .animate-pop {
      animation: popUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes popUp {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Error Card */
    .error-card {
      background: #fef2f2;
      border: 1.5px solid #fecaca;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: #991b1b;
    }

    .error-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #fee2e2;
      color: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .error-content h3 {
      font-size: 14.5px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .error-content p {
      font-size: 13px;
      color: #b91c1c;
      line-height: 1.45;
    }

    /* Student Ticket Card */
    .ticket-card {
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    .ticket-top {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 18px 20px;
      position: relative;
    }

    .ticket-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .status-verified {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .kelas-tag {
      background: rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 8px;
      letter-spacing: 0.4px;
    }

    .student-name {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.2px;
      margin-bottom: 4px;
    }

    .student-nisn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: #94a3b8;
    }

    /* Ticket Perforation Divider */
    .ticket-divider {
      position: relative;
      height: 18px;
      background: #ffffff;
      display: flex;
      align-items: center;
    }

    .ticket-divider::before,
    .ticket-divider::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: #e2e8f0;
      border-radius: 50%;
      top: 0;
    }

    .ticket-divider::before { left: -9px; }
    .ticket-divider::after { right: -9px; }

    .ticket-dashed {
      width: 100%;
      border-top: 2px dashed #e2e8f0;
      margin: 0 14px;
    }

    .ticket-body {
      padding: 12px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cred-item {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s ease;
    }

    .cred-item:hover {
      border-color: #cbd5e1;
    }

    .cred-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cred-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }

    .cred-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
    }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      transition: all 0.15s ease;
    }

    .btn-copy:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .btn-copy.copied {
      background: #ecfdf5;
      color: #059669;
      border-color: #6ee7b7;
    }

    .btn-copy-all {
      margin-top: 2px;
      width: 100%;
      padding: 11px;
      background: #eef2ff;
      color: var(--primary);
      border: 1px dashed #a5b4fc;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-copy-all:hover {
      background: #e0e7ff;
    }

    .footer-note {
      margin-top: 22px;
      text-align: center;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.65);
      position: relative;
      z-index: 1;
    }

    @media (max-width: 420px) {
      .glass-card {
        padding: 28px 20px;
        border-radius: 20px;
      }
      .brand-header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <main class="wrapper">
    <section class="glass-card">
      <header class="brand-header">
        <div class="icon-shield" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div class="pill-badge">
          <span class="pill-dot"></span>
          Portal Peserta CBT AKM 2026
        </div>
        <h1>Cek Akun Ujian</h1>
        <p>Masukkan <strong>NISN</strong> Anda di bawah ini untuk menampilkan kartu identitas, username, dan password login CBT.</p>
      </header>

      <form class="search-box" id="searchForm" novalidate>
        <div>
          <div class="field-label">
            <label for="nisnInput">Nomor Induk Siswa Nasional</label>
            <span class="field-hint">10 Digit Angka</span>
          </div>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="3"/>
                <line x1="7" y1="9" x2="17" y2="9"/>
                <line x1="7" y1="13" x2="13" y2="13"/>
              </svg>
            </span>
            <input
              type="text"
              id="nisnInput"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="12"
              placeholder="Ketik NISN Anda..."
              autocomplete="off"
              required
            />
            <button type="button" class="btn-clear" id="clearBtn" title="Hapus input" aria-label="Hapus input">&times;</button>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Tampilkan Akun Ujian
        </button>
      </form>

      <div class="result-area" id="resultBox" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer-note">
    &copy; 2026 Panitia Ujian CBT AKM &bull; Sistem Informasi Peserta
  </footer>

    const nisnInput = document.getElementById('nisnInput');
    const clearBtn = document.getElementById('clearBtn');
    const resultBox = document.getElementById('resultBox');

    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag]));
    }

    // Hanya izinkan input angka & tampilkan tombol clear
    nisnInput.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '');
      clearBtn.style.display = this.value.length > 0 ? 'flex' : 'none';
    });

    clearBtn.addEventListener('click', function () {
      nisnInput.value = '';
      clearBtn.style.display = 'none';
      resultBox.style.display = 'none';
      nisnInput.focus();
    });

    function copyText(text, btnElement, defaultLabel = 'Salin') {
      navigator.clipboard.writeText(text).then(() => {
        btnElement.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

          </svg>
          Tersalin
        `;
        btnElement.classList.add('copied');
        setTimeout(() => {
          btnElement.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            ${defaultLabel}
          `;
          btnElement.classList.remove('copied');
        }, 1600);
      });
    }

        nisnInput.focus();
        return;
      }

      let student = STUDENT_DB[rawNisn];
      let matchedNisn = rawNisn;

        const paddedNisn = rawNisn.padStart(10, '0');
        if (STUDENT_DB[paddedNisn]) {
          student = STUDENT_DB[paddedNisn];
          matchedNisn = paddedNisn;
        }
      }

      resultBox.style.display = 'block';
      resultBox.classList.remove('animate-pop');
      void resultBox.offsetWidth; // trigger reflow for restart animation
      resultBox.classList.add('animate-pop');

      if (student) {
        const safeNama = escapeHTML(student.nama);
        const safeKelas = escapeHTML(student.kelas);
        const safeUser = escapeHTML(student.username);
        const safePass = escapeHTML(student.password);
        const safeNisn = escapeHTML(matchedNisn);

        resultBox.innerHTML = `
          <div class="ticket-card">
            <div class="ticket-top">
              <div class="ticket-meta">
                <span class="status-verified">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                  Terverifikasi
                </span>
                <span class="kelas-tag">Kelas ${safeKelas}</span>
              </div>
              <div class="student-name">${safeNama}</div>
              <div class="student-nisn">NISN: ${safeNisn}</div>
            </div>

            <div class="ticket-divider">
              <div class="ticket-dashed"></div>
            </div>

            <div class="ticket-body">
              <div class="cred-item">
                <div class="cred-info">
                  <span class="cred-label">Username CBT</span>
                  <span class="cred-value">${safeUser}</span>
                </div>
                <button type="button" class="btn-copy" onclick="copyText('${safeUser}', this, 'Salin')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                  Salin
                </button>
              </div>

              <div class="cred-item">
                <div class="cred-info">
                  <span class="cred-label">Password CBT</span>
                  <span class="cred-value">${safePass}</span>
                </div>
                <button type="button" class="btn-copy" onclick="copyText('${safePass}', this, 'Salin')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                  Salin
                </button>
              </div>

              <button type="button" class="btn-copy-all" onclick="copyText('Nama: ${safeNama}\nKelas: ${safeKelas}\nUsername: ${safeUser}\nPassword: ${safePass}', this, 'Salin Semua Info Akun')">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                Salin Semua Info Akun
              </button>
            </div>
          </div>
        `;
      } else {
        resultBox.innerHTML = `
          <div class="error-card">
            <div class="error-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            </div>
            <div class="error-content">
              <h3>Data NISN Tidak Ditemukan</h3>
              <p>NISN <strong>${escapeHTML(rawNisn)}</strong> tidak terdaftar dalam database peserta CBT AKM 2026. Periksa kembali angka yang diketik atau hubungi panitia.</p>
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
